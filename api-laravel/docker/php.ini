; Production php.ini overrides for the api-laravel container (php:8.4-fpm-alpine).

memory_limit = 512M
; Billing math uses bcmath scale 15 (BcNumeric cast) — never floats.
date.timezone = UTC

[opcache]
opcache.enable = 1
; Immutable image: no stat calls to revalidate cached bytecode.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Lighthouse query cache (LIGHTHOUSE_QUERY_CACHE_MODE=opcache) also relies on
; opcache file storage under bootstrap/cache.
