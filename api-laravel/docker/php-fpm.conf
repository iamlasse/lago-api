; php-fpm master overrides for the api-laravel container.
; Base image config: /usr/local/etc/php-fpm.conf + pool.d/www.conf.
; We only patch what must differ; www.conf already runs the pool as www-data
; on 127.0.0.1:9000.

[global]
; Unprivileged master: pid under /tmp.
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

; CRITICAL: the default www.conf sets clear_env=yes, which strips all
; container environment variables from the worker processes. Laravel reads
; config from the cached config (fine), but job classes call env() at runtime
; (SIDEKIQ_* queue-split flags) — with clear_env=yes those reads would see
; nothing under php-fpm.
[www]
clear_env = no
catch_workers_output = yes
; Billing fan-outs and webhook dispatch can run long.
request_terminate_timeout = 120s
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
