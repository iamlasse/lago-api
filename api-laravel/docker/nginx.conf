# nginx fronting php-fpm for the api-laravel container.
# Drop-in for the Rails `api` container: listens on 3000, serves Laravel's
# public/ (equivalent of Rails' public/ + Puma upstream).
#
# Written for an unprivileged (www-data) master: pid + temp paths under /tmp.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Lago accepts large payloads (imports, batched events) — mirror the
    # Rails API's generous body limit.
    client_max_body_size 100m;

    # Unprivileged master needs writable temp dirs.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    gzip on;
    gzip_types application/json;

    server {
        listen 3000;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # GET /health and /ready go through PHP (port of
        # ApplicationController#health/#ready — /health touches the DB).
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # Long-running billing requests (invoice finalization fan-out)
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\. {
            deny all;
        }
    }
}
